site_name: oxo-flow-community
site_url: https://oxo-flow-community.github.io/
site_description: >-
  The community catalog of oxo-flow workflows — verified ports of established
  nf-core and Snakemake pipelines, original designs, and community submissions.
  Classified, rated, and documented. Search, compare, run.
repo_url: https://github.com/oxo-flow-community/oxo-flow-community.github.io
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  font: false
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/pipelines-data.js
  - javascripts/catalog.js

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Get started: about/getting-started.md
  - Pipelines: pipelines/index.md
  - Catalog:
      - Curation & ratings: about/curation.md
      - Selection: about/selection.md
      - Porting guide: about/porting.md
      - Workflow repo spec: about/workflow-repo-spec.md
      - Live testing: about/live-testing.md
  - Project:
      - Contributing: about/contributing.md
      - Audits:
          - 2026 08 Campaign Summary: about/audits/2026-08-campaign-summary.md
          - Ampliseq (2026 08): about/audits/ampliseq-2026-08.md
          - Atacseq (2026 08): about/audits/atacseq-2026-08.md
