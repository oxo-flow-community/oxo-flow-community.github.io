name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install "mkdocs-material>=9.5" "pymdown-extensions>=10"
      - name: Validate registry + regenerate pages (must be drift-free)
        run: |
          python3 scripts/generate.py
          git diff --exit-code -- docs/ data/ scripts/ || {
            echo "::error::generated pages drift from data/pipelines.json — run scripts/generate.py and commit"
            exit 1
          }
      - name: Build site
        run: mkdocs build --strict
      - name: Verify every registry entry has a built page
        run: |
          python3 - <<'EOF'
          import json, pathlib
          data = json.loads(pathlib.Path("data/pipelines.json").read_text())
          missing = [p["name"] for p in data
                     if not pathlib.Path(f"site/pipelines/{p['name']}/index.html").is_file()]
          if missing:
              print(f"::error::built pages missing for: {missing}")
              raise SystemExit(1)
          print(f"verified: {len(data)} pages present")
          EOF
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live pages serve 200 (post-deploy smoke check)
        run: |
          python3 - <<'EOF'
          import json, pathlib, subprocess, sys, time

          base = "https://oxo-flow-community.github.io"
          data = json.loads(pathlib.Path("data/pipelines.json").read_text())
          urls = [base + "/", base + "/pipelines/"]
          urls += [base + "/pipelines/" + p["name"] + "/" for p in data]
          # Pages CDN propagation can lag the deployment by a few minutes;
          # poll until every registry page serves 200, fail loudly otherwise.
          deadline = time.time() + 240
          pending = urls
          while pending and time.time() < deadline:
              still = []
              for url in pending:
                  try:
                      code = subprocess.run(
                          ["curl", "-s", "-o", "/dev/null", "-w", "%{http_code}", url],
                          capture_output=True, text=True, timeout=30,
                      ).stdout.strip()
                  except Exception:
                      code = "000"
                  if code != "200":
                      still.append(url)
              pending = still
              if pending:
                  time.sleep(15)
          if pending:
              print("::error::live pages not serving 200 after deployment:")
              for url in pending:
                  print(f"::error::  {url}")
              sys.exit(1)
          print(f"verified live: {len(urls)} URLs return 200")
          EOF
