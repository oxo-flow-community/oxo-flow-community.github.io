{# Custom header button: "Submit an issue" next to the GitHub repo icon #}
{% extends "base.html" %}

{% block header %}
  {{ super() }}
  <a href="https://github.com/oxo-flow-community/oxo-flow-community.github.io/issues/new"
     class="md-header__button md-icon ox-issue-btn"
     title="Submit an issue" aria-label="Submit an issue">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
    </svg>
    <span class="ox-issue-label">Submit an issue</span>
  </a>
{% endblock %}
